name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    name: JavaScript and CSS
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install video test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg

      - name: Lint and run unit tests
        run: npm run verify

  php:
    name: PHP 8.3
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Confirm pinned runner runtime
        run: php -r 'if (PHP_VERSION_ID < 80300 || PHP_VERSION_ID >= 80400) { fwrite(STDERR, "Expected PHP 8.3, got " . PHP_VERSION . PHP_EOL); exit(1); }'

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish

      - name: Install locked dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Lint and run unit tests
        run: composer verify

  artifacts:
    name: Build release artifacts
    needs:
      - javascript
      - php
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build plugin and Playground bundles
        run: ./bin/build-playground-bundle.sh

      - name: Verify artifact checksums and layouts
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^ \* Version:[[:space:]]*//p' plugin/wmcp-agentsnr/wmcp-agentsnr.php | head -n 1)"
          plugin="dist/wmcp-agentsnr-${version}.zip"
          playground="dist/wmcp-agentsnr-playground-${version}.zip"
          (
            cd dist
            shasum -a 256 -c "wmcp-agentsnr-${version}.zip.sha256"
            shasum -a 256 -c "wmcp-agentsnr-playground-${version}.zip.sha256"
          )
          test "$(unzip -Z1 "${plugin}" | cut -d/ -f1 | sort -u)" = "wmcp-agentsnr"
          test "$(unzip -Z1 "${playground}" | head -n 1)" = "blueprint.json"
          unzip -Z1 "${playground}" | grep -Fx 'wmcp-agentsnr.zip'
          unzip -tq "${plugin}"
          unzip -tq "${playground}"

      - name: Upload checksummed artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wmcp-agentsnr-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  playground:
    name: WordPress Playground
    needs:
      - javascript
      - php
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build Blueprint bundle
        run: ./bin/build-playground-bundle.sh

      - name: Validate and execute the complete Blueprint
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^ \* Version:[[:space:]]*//p' plugin/wmcp-agentsnr/wmcp-agentsnr.php | head -n 1)"
          npx --yes @wp-playground/cli@3.1.51 run-blueprint \
            --blueprint="dist/wmcp-agentsnr-playground-${version}.zip" \
            --verbosity=normal

  docker-smoke:
    name: Docker ${{ matrix.name }}
    needs:
      - javascript
      - php
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimum
            wordpress_image: wordpress:6.9-php8.1-apache
            cli_image: wordpress:cli-2.12-php8.1
            woocommerce_version: 10.9.4
            hpos: "no"
          - name: WordPress-7.0
            wordpress_image: wordpress:7.0.4-php8.3-apache
            cli_image: wordpress:cli-2.12-php8.3
            woocommerce_version: 11.0.1
            hpos: "no"
          - name: primary
            wordpress_image: wordpress:7.1-php8.3-apache
            cli_image: wordpress:cli-2.12-php8.3
            woocommerce_version: 11.0.1
            hpos: "yes"
    env:
      WMCP_HTTP_PORT: 18080
      WMCP_WORDPRESS_IMAGE: ${{ matrix.wordpress_image }}
      WMCP_CLI_IMAGE: ${{ matrix.cli_image }}
      WMCP_WOOCOMMERCE_VERSION: ${{ matrix.woocommerce_version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Bootstrap a clean demo
        run: ./bin/start-demo.sh

      - name: Configure and verify order storage mode
        shell: bash
        run: |
          set -euo pipefail
          docker compose run --rm cli wp option update woocommerce_custom_orders_table_enabled "${{ matrix.hpos }}"
          actual="$(docker compose run --rm cli wp eval 'echo Automattic\WooCommerce\Utilities\OrderUtil::custom_orders_table_usage_is_enabled() ? "yes" : "no";')"
          test "${actual}" = "${{ matrix.hpos }}"

      - name: Run the HTTP and REST smoke suite
        run: ./bin/run-smoke-tests.sh

      - name: Run the WooCommerce order/refund lifecycle suite
        run: ./bin/run-woo-lifecycle-tests.sh

      - name: Verify activation, idempotent seeding, and public routes
        shell: bash
        run: |
          set -euo pipefail
          docker compose run --rm cli wp plugin is-active woocommerce
          docker compose run --rm cli wp plugin is-active wmcp-agentsnr
          before="$(docker compose run --rm cli wp post list --post_type=product --format=count | tr -d '\r')"
          test "${before}" = "12"
          docker compose run --rm cli wp eval-file /workspace/bin/seed-demo.php
          after="$(docker compose run --rm cli wp post list --post_type=product --format=count | tr -d '\r')"
          test "${after}" = "${before}"
          for path in / /storefront-demo/ /agentsnr-demo/ /webmcp-health/ /shop/ /cart/ /checkout/; do
            curl --fail --silent --show-error \
              --retry 10 --retry-all-errors --retry-delay 2 \
              "http://127.0.0.1:18080${path}" >/dev/null
          done

      - name: Run official WordPress Plugin Check
        if: matrix.name == 'primary'
        run: |
          docker compose run --rm cli wp plugin install plugin-check --activate
          docker compose run --rm cli wp plugin check wmcp-agentsnr --format=table

      - name: Use Node.js 22 for browser acceptance tests
        if: matrix.name == 'primary'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked browser test tooling and Chromium
        if: matrix.name == 'primary'
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run pinned native WebMCP discovery smoke
        if: matrix.name == 'primary'
        env:
          WMCP_BASE_URL: http://localhost:18080
        run: npm run test:webmcp:smoke

      - name: Run browser acceptance tests
        if: matrix.name == 'primary'
        env:
          WMCP_BASE_URL: http://localhost:18080
        run: npm run test:browser -- --workers=1

      - name: Show container logs after a failure
        if: failure()
        run: docker compose logs --no-color

      - name: Remove the disposable demo
        if: always()
        run: docker compose down --volumes --remove-orphans
