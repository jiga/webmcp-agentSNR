name: Release artifacts

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-build:
    name: Verify tag and build artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Verify tag and plugin versions agree
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^ \* Version:[[:space:]]*//p' plugin/wmcp-agentsnr/wmcp-agentsnr.php | head -n 1)"
          case "${GITHUB_REF_NAME}" in
            "v${version}"|"v${version}-"*) ;;
            *)
              echo "Tag ${GITHUB_REF_NAME} does not match plugin version ${version}." >&2
              exit 1
              ;;
          esac

      - name: Verify JavaScript and CSS
        run: |
          npm ci
          npm run verify

      - name: Verify PHP
        run: |
          composer validate --strict --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist
          composer verify

      - name: Build checksummed release artifacts
        shell: bash
        run: |
          set -euo pipefail
          ./bin/build-playground-bundle.sh
          (
            cd dist
            shasum -a 256 ./*.zip | sed 's#  \./#  #' > SHA256SUMS
            shasum -a 256 -c SHA256SUMS
          )

      - name: Execute the packaged Playground Blueprint
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^ \* Version:[[:space:]]*//p' plugin/wmcp-agentsnr/wmcp-agentsnr.php | head -n 1)"
          npx --yes @wp-playground/cli@3.1.51 run-blueprint \
            --blueprint="dist/wmcp-agentsnr-playground-${version}.zip" \
            --verbosity=normal

      - name: Upload artifacts for acceptance
        uses: actions/upload-artifact@v7
        with:
          name: release-candidate-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*.sha256
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  acceptance:
    name: Exact ZIP / ${{ matrix.name }}
    needs: verify-and-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimum
            wordpress_image: wordpress:6.9-php8.1-apache
            cli_image: wordpress:cli-2.12-php8.1
            woocommerce_version: 10.9.4
            hpos: "no"
          - name: WordPress-7.0
            wordpress_image: wordpress:7.0.4-php8.3-apache
            cli_image: wordpress:cli-2.12-php8.3
            woocommerce_version: 11.0.1
            hpos: "no"
          - name: primary
            wordpress_image: wordpress:7.1-php8.3-apache
            cli_image: wordpress:cli-2.12-php8.3
            woocommerce_version: 11.0.1
            hpos: "yes"
    env:
      WMCP_HTTP_PORT: 18080
      WMCP_WORDPRESS_IMAGE: ${{ matrix.wordpress_image }}
      WMCP_CLI_IMAGE: ${{ matrix.cli_image }}
      WMCP_WOOCOMMERCE_VERSION: ${{ matrix.woocommerce_version }}
      WMCP_PLUGIN_DIR: ${{ github.workspace }}/.release-test/wmcp-agentsnr
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download the release candidate
        uses: actions/download-artifact@v8
        with:
          name: release-candidate-${{ github.sha }}
          path: dist

      - name: Extract and verify the exact plugin ZIP
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^ \* Version:[[:space:]]*//p' plugin/wmcp-agentsnr/wmcp-agentsnr.php | head -n 1)"
          mkdir -p .release-test
          unzip -q "dist/wmcp-agentsnr-${version}.zip" -d .release-test
          test -f .release-test/wmcp-agentsnr/wmcp-agentsnr.php
          test "$(unzip -Z1 "dist/wmcp-agentsnr-${version}.zip" | cut -d/ -f1 | sort -u)" = "wmcp-agentsnr"

      - name: Bootstrap a clean demo from the exact ZIP
        run: ./bin/start-demo.sh

      - name: Configure and verify order storage mode
        shell: bash
        run: |
          set -euo pipefail
          docker compose run --rm cli wp option update woocommerce_custom_orders_table_enabled "${{ matrix.hpos }}"
          actual="$(docker compose run --rm cli wp eval 'echo Automattic\WooCommerce\Utilities\OrderUtil::custom_orders_table_usage_is_enabled() ? "yes" : "no";')"
          test "${actual}" = "${{ matrix.hpos }}"

      - name: Run HTTP, REST, security, commerce, and analytics acceptance
        run: ./bin/run-smoke-tests.sh

      - name: Run the WooCommerce order/refund lifecycle suite
        run: ./bin/run-woo-lifecycle-tests.sh

      - name: Verify activation and idempotent demo seeding
        shell: bash
        run: |
          set -euo pipefail
          docker compose run --rm cli wp plugin is-active woocommerce
          docker compose run --rm cli wp plugin is-active wmcp-agentsnr
          before="$(docker compose run --rm cli wp post list --post_type=product --format=count | tr -d '\r')"
          test "${before}" = "12"
          docker compose run --rm cli wp eval-file /workspace/bin/seed-demo.php
          after="$(docker compose run --rm cli wp post list --post_type=product --format=count | tr -d '\r')"
          test "${after}" = "${before}"

      - name: Run official WordPress Plugin Check
        if: matrix.name == 'primary'
        run: |
          docker compose run --rm cli wp plugin install plugin-check --activate
          docker compose run --rm cli wp plugin check wmcp-agentsnr --format=table

      - name: Use Node.js 22 for browser acceptance
        if: matrix.name == 'primary'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked browser tooling and Chromium
        if: matrix.name == 'primary'
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run pinned native WebMCP discovery smoke against the exact ZIP
        if: matrix.name == 'primary'
        env:
          WMCP_BASE_URL: http://localhost:18080
        run: npm run test:webmcp:smoke

      - name: Run browser acceptance against the exact ZIP
        if: matrix.name == 'primary'
        env:
          WMCP_BASE_URL: http://localhost:18080
        run: npm run test:browser -- --workers=1

      - name: Show container logs after a failure
        if: failure()
        run: docker compose logs --no-color

      - name: Remove the disposable demo
        if: always()
        run: docker compose down --volumes --remove-orphans

  publish:
    name: Publish verified release
    needs:
      - verify-and-build
      - acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download accepted artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-candidate-${{ github.sha }}
          path: dist

      - name: Re-verify accepted artifact checksums
        run: cd dist && shasum -a 256 -c SHA256SUMS

      - name: Upload immutable workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wmcp-agentsnr-${{ github.ref_name }}
          path: |
            dist/*.zip
            dist/*.sha256
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 90

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            release_flags=()
            version="$(sed -n 's/^ \* Version:[[:space:]]*//p' plugin/wmcp-agentsnr/wmcp-agentsnr.php | head -n 1)"
            if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
              release_flags+=(--prerelease)
            fi
            gh release create "${GITHUB_REF_NAME}" \
              --verify-tag \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes \
              "${release_flags[@]}"
          fi
          gh release upload "${GITHUB_REF_NAME}" \
            dist/*.zip \
            dist/*.sha256 \
            dist/SHA256SUMS \
            --clobber
